<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>고래밥 바다생물 탐구</title>
<style>
  :root{
    --bg1:#dff6ff; --bg2:#8fd3ff; --sea:#2b9ee8; --deep:#0c6fb8;
    --card:#ffffff; --text:#17324d; --yellow:#ffe269; --shadow:0 10px 30px rgba(13,78,121,.18);
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Arial","Pretendard",sans-serif; color:var(--text);
    background:linear-gradient(var(--bg1), var(--bg2));
    min-height:100vh;
  }
  header{
    text-align:center; padding:34px 20px 18px;
  }
  h1{margin:0; font-size:clamp(28px,5vw,52px); color:#075f9f}
  header p{font-size:18px; margin:10px 0 0}
  .hint{
    display:inline-block; margin-top:12px; padding:8px 14px; border-radius:999px;
    background:#fff7c5; font-weight:700;
  }
  .grid{
    width:min(1180px,92%); margin:20px auto 60px;
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:18px;
  }
  .animal{
    border:0; background:rgba(255,255,255,.92); border-radius:24px; padding:12px;
    min-height:190px; cursor:pointer; box-shadow:var(--shadow); transition:.2s transform,.2s box-shadow;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .animal:hover,.animal:focus{transform:translateY(-6px) scale(1.02); box-shadow:0 16px 36px rgba(13,78,121,.25)}
  .thumb-wrap{width:100%;height:112px;border-radius:17px;overflow:hidden;background:#dff4ff;display:flex;align-items:center;justify-content:center}
  .thumb{width:100%;height:100%;object-fit:cover;display:block}
  .thumb-fallback{font-size:58px;display:none}
  .animal strong{font-size:21px; margin-top:12px}
  .animal small{font-size:13px; color:#5b7890; margin-top:5px}
  .bubble{position:fixed;border-radius:50%;background:rgba(255,255,255,.35);pointer-events:none}
  .b1{width:55px;height:55px;left:5%;bottom:8%}.b2{width:28px;height:28px;left:13%;bottom:22%}
  .b3{width:70px;height:70px;right:8%;bottom:14%}.b4{width:34px;height:34px;right:15%;bottom:31%}

  dialog{
    width:min(920px,94vw); border:0; border-radius:30px; padding:0; box-shadow:0 30px 80px rgba(0,0,0,.3);
  }
  dialog::backdrop{background:rgba(0,44,76,.6); backdrop-filter:blur(3px)}
  .modal{background:white; overflow:hidden; border-radius:30px}
  .modal-top{
    padding:24px 26px; display:flex; justify-content:space-between; align-items:center;
    background:linear-gradient(135deg,#0d85cf,#55c8f4); color:white;
  }
  .title-wrap{display:flex;gap:16px;align-items:center}
  .bigemoji{font-size:58px}
  .modal h2{margin:0;font-size:34px}
  .nickname{opacity:.9;margin-top:4px;font-weight:700}
  .close{
    width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.2);
    color:white;font-size:24px;cursor:pointer
  }
  .content{display:grid;grid-template-columns:1.05fr 1fr;gap:22px;padding:25px}
  .photo{
    min-height:330px;border-radius:24px;overflow:hidden;background:#e6f7ff;
    position:relative; display:flex;align-items:center;justify-content:center
  }
  .photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .photo-fallback{font-size:110px}
  .facts{display:grid;gap:12px}
  .fact{background:#f4fbff;border-radius:18px;padding:15px 17px;border-left:6px solid #4db8ed}
  .fact h3{margin:0 0 6px;font-size:18px}
  .fact p{margin:0;line-height:1.55;font-size:16px}
  .source{font-size:12px;color:#6f8797;padding:0 25px 22px;text-align:right}
  @media(max-width:720px){
    .content{grid-template-columns:1fr}
    .photo{min-height:250px}
    .grid{grid-template-columns:repeat(2,1fr)}
    .animal{min-height:145px}
  }
</style>
</head>
<body>
<header>
  <h1>🐳 고래밥 바다생물 탐구</h1>
  <p>고래밥 속 바다 친구의 실제 사진을 보고, 눌러서 생물의 특징을 알아보세요!</p>
  <div class="hint">총 16가지 바다 친구 🐚 · 사진 링크 점검판</div>
</header>

<main class="grid" id="grid"></main>

<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div><div class="bubble b4"></div>

<dialog id="detail">
  <div class="modal">
    <div class="modal-top">
      <div class="title-wrap">
        <div class="bigemoji" id="mEmoji"></div>
        <div><h2 id="mName"></h2><div class="nickname" id="mNick"></div></div>
      </div>
      <button class="close" onclick="detail.close()" aria-label="닫기">✕</button>
    </div>
    <div class="content">
      <div class="photo">
        <img id="mImg" alt="" onerror="this.style.display='none'">
        <div class="photo-fallback" id="mFallback"></div>
      </div>
      <div class="facts">
        <div class="fact"><h3>🍽️ 먹이</h3><p id="mFood"></p></div>
        <div class="fact"><h3>🦈 천적</h3><p id="mEnemy"></p></div>
        <div class="fact"><h3>🌊 살아가는 환경</h3><p id="mHabitat"></p></div>
        <div class="fact"><h3>🔎 특징</h3><p id="mFeature"></p></div>
        <div class="fact"><h3>✨ 재미있는 사실</h3><p id="mFun"></p></div>
      </div>
    </div>
    <div class="source">사진은 공개된 Wikimedia Commons 자료를 중심으로 활용합니다. 이미지가 보이지 않을 경우 이모지로 대체됩니다.</div>
  </div>
</dialog>

const grid = document.getElementById("grid");
animals.forEach((a,i)=>{
  const b=document.createElement("button");
  b.className="animal";
  b.innerHTML=`<div class="thumb-wrap"><img class="thumb" src="${a.img}" alt="${a.name} 실제 사진" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="thumb-fallback">${a.emoji}</span></div><strong>${a.name}</strong><small>고래밥 친구 ${i+1}</small>`;
  b.onclick=()=>showAnimal(a);
  grid.appendChild(b);
});

function showAnimal(a){
  mEmoji.textContent=a.emoji; mName.textContent=a.name; mNick.textContent=`고래밥 캐릭터 이름: ${a.nick}`;
  mFallback.textContent=a.emoji; mImg.src=a.img; mImg.alt=`${a.name} 실제 모습`;
  mImg.style.display="block";
  mFood.textContent=a.food; mEnemy.textContent=a.enemy; mHabitat.textContent=a.habitat;
  mFeature.textContent=a.feature; mFun.textContent=a.fun;
  detail.showModal();
}
detail.addEventListener("click",(e)=>{ if(e.target===detail) detail.close(); });
</script>
</body>
</html>
